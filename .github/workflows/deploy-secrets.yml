name: Deploy Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-secrets:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Deploy application secret
        env:
          SECRET_VALUE: ${{ secrets.APP_SECRET }}
        run: |
          echo -n "$SECRET_VALUE" | gcloud secrets versions add app-secret-${{ inputs.environment }} \
            --data-file=- \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Verify secret
        run: |
          gcloud secrets versions access latest \
            --secret=app-secret-${{ inputs.environment }} \
            --project=${{ secrets.GCP_PROJECT_ID }}