name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-22.04
    outputs:
      dev_changed: ${{ steps.filter.outputs.dev }}
      prod_changed: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'

  plan-dev:
    name: Plan Dev
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.dev_changed == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/dev
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID_DEV }}
          TF_VAR_github_repository: ${{ github.repository }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: tfplan-dev
          path: terraform/environments/dev/tfplan
          retention-days: 1

      - name: Comment Plan on PR
        uses: actions/github-script@v8.0.0
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan - Dev
            \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  plan-prod:
    name: Plan Prod
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.prod_changed == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform/environments/prod
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/prod
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/prod
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_domain: ${{ secrets.PROD_DOMAIN }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: tfplan-prod
          path: terraform/environments/prod/tfplan
          retention-days: 1

      - name: Comment Plan on PR
        uses: actions/github-script@v8.0.0
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan - Prod
            \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })